components:
  securitySchemes:
    MakeCryptoKeyId:
      type: apiKey
      in: header
      name: X-MakeCrypto-Key-Id
    MakeCryptoKeySecret:
      type: apiKey
      in: header
      name: X-MakeCrypto-Key-Secret
    MakePayKeyId:
      type: apiKey
      in: header
      name: X-MakePay-Key-Id
    MakePayKeySecret:
      type: apiKey
      in: header
      name: X-MakePay-Key-Secret
    LegacyApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
    LegacyApiSecret:
      type: apiKey
      in: header
      name: X-Api-Secret
  parameters:
    PaymentLinkUid:
      name: uid
      in: path
      required: true
      schema:
        type: string
      example: 01jsg7w9n8pz8l4x0dn26v2aqd
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Status:
      name: status
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    OnboardingRequired:
      description: Merchant setup is incomplete.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    ErrorBody:
      type: object
      required: [error]
      additionalProperties: true
      properties:
        error:
          type: string
        errorCode:
          type: string
    DecimalString:
      oneOf:
        - type: string
        - type: number
    PaymentLinkStatus:
      type: string
      enum: [active, paused, archived]
    PaymentSessionStatus:
      type: string
      enum:
        - quoted
        - awaiting_deposit
        - pending
        - deposit_received
        - swapping
        - sending
        - complete
        - failed
        - expired
        - underpaid
        - cancelled
    PaymentLinkPayload:
      type: object
      required: [amount]
      additionalProperties: true
      properties:
        title:
          type: string
        label:
          type: string
        description:
          type: string
        amount:
          $ref: "#/components/schemas/DecimalString"
        currency:
          type: string
          example: USDT
        asset:
          type: string
          example: ETH.USDT-0xdac17f958d2ee523a2206206994597c13d831ec7
        orderId:
          type: string
        merchantOrderId:
          type: string
        customerEmail:
          type: string
          format: email
        receiptEmail:
          type: string
          format: email
        clientId:
          type: string
        returnUrl:
          type: string
          format: uri
        successUrl:
          type: string
          format: uri
        failureUrl:
          type: string
          format: uri
        returnRedirectUrl:
          type: string
          format: uri
        successRedirectUrl:
          type: string
          format: uri
        failureRedirectUrl:
          type: string
          format: uri
        expirationTime:
          type: string
          examples: [15m, 1h, 12h, 24h, 72h, never]
        metadata:
          type: object
          additionalProperties: true
    DonationPayload:
      allOf:
        - $ref: "#/components/schemas/PaymentLinkPayload"
        - type: object
          additionalProperties: true
          properties:
            defaultAmountUsd:
              $ref: "#/components/schemas/DecimalString"
            minimumAmountUsd:
              $ref: "#/components/schemas/DecimalString"
            donationSlug:
              type: string
    CreatePaymentLinkRequest:
      type: object
      additionalProperties: true
      properties:
        status:
          $ref: "#/components/schemas/PaymentLinkStatus"
        sendPaymentRequestEmail:
          type: boolean
        payload:
          $ref: "#/components/schemas/PaymentLinkPayload"
    CreateDonationLinkRequest:
      type: object
      additionalProperties: true
      properties:
        status:
          $ref: "#/components/schemas/PaymentLinkStatus"
        sendPaymentRequestEmail:
          type: boolean
        payload:
          $ref: "#/components/schemas/DonationPayload"
    AnonymousPaymentLinkPayload:
      type: object
      required: [amount, settlement]
      additionalProperties: true
      properties:
        amount:
          $ref: "#/components/schemas/DecimalString"
        settlement:
          type: object
          required: [currency, priorities]
          additionalProperties: true
          properties:
            currency:
              type: string
            priorities:
              type: array
              items:
                type: object
                required: [chain, address]
                additionalProperties: true
                properties:
                  chain:
                    type: string
                  address:
                    type: string
                  asset:
                    type: string
                  assetIdentifier:
                    type: string
        title:
          type: string
        webhookUrl:
          type: string
          format: uri

    MakePayWebhookEvent:
      type: object
      required: [deliveryId, type, event, paymentLink, session]
      additionalProperties: true
      properties:
        deliveryId:
          type: string
          format: uuid
        type:
          type: string
          example: makepay.payment.status_changed
        createdAt:
          type: string
          format: date-time
        event:
          type: object
          required: [type]
          additionalProperties: true
          properties:
            type:
              type: string
              enum:
                - channel_created
                - status_changed
                - settlement_updated
                - manual_resolution_completed
                - underpayment_difference_requested
                - refund_address_requested
                - refund_address_received
                - payment_cancelled_by_payer
                - payment_request_expired
                - quote_expired
                - start_blocked_missing_company_wallet
            trigger:
              type: string
        paymentLink:
          $ref: "#/components/schemas/PaymentLink"
        session:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/PaymentSessionStatus"
            previousStatus:
              $ref: "#/components/schemas/PaymentSessionStatus"
            settlementAmount:
              $ref: "#/components/schemas/GenericObject"
        data:
          $ref: "#/components/schemas/GenericObject"

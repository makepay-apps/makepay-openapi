      summary: Open a deposit channel for a quoted session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Started payment session.
          content:

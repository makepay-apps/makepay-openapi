openapi: 3.1.0
info:
  title: MakePay API
  version: 0.1.0
  summary: Partner, checkout, and bookkeeping API description for MakePay.
  description: |
    This OpenAPI document describes the public MakePay partner API surfaces used
    by SDKs, plugins, automation tools, and commerce integrations.

    Authenticated partner requests use server-side API keys. Do not expose key
    secrets in browsers, mobile apps, public repositories, client-side plugins,
    or logs.
  contact:
    name: MakePay
    email: info@makepay.io
    url: https://www.makecrypto.io
  license:
    name: MIT
    url: https://opensource.org/license/mit/
servers:
  - url: https://www.makecrypto.io
    description: MakeCrypto partner API
  - url: https://makepay.io
    description: MakePay hosted checkout and public payer API
security:
  - MakeCryptoKeyId: []
    MakeCryptoKeySecret: []
  - MakePayKeyId: []
    MakePayKeySecret: []
  - LegacyApiKey: []
    LegacyApiSecret: []
tags:
  - name: Payment Links
    description: Hosted checkout links and merchant payment requests.
  - name: Public Checkout
    description: Public payer checkout, quote, and session endpoints.
  - name: Donations
    description: Flexible-amount donation links and campaign pages.
  - name: Customers
    description: Merchant customer profiles and customer portal links.
  - name: Subscriptions
    description: Recurring billing and payment request subscriptions.
  - name: POS
    description: Point-of-sale terminals and payment catalog controls.
  - name: Products
    description: Merchant product catalog and digital download records.
  - name: Simple Shop
    description: MakePay-hosted storefront settings, content, coupons, and orders.
  - name: Branding
    description: Merchant payment-link, checkout, and email branding.
  - name: Bookkeeping
    description: Invoices, expenses, documents, OCR, and reconciliation links.
  - name: Operations
    description: Settings, destination assets, and operational endpoints.
  - name: Webhooks
    description: Webhook delivery logs and signed event payloads.
webhooks:
  makePayPaymentEvent:
    post:
      tags: [Webhooks]
      operationId: receiveMakePayWebhook
      summary: Receive a signed MakePay webhook event.
      description: |
        Webhook consumers must verify `X-MakePay-Signature` against
        `<timestamp>.<raw body>` using the merchant webhook secret before
        parsing or acting on the event.
      security: []
      parameters:
        - name: X-MakePay-Signature
          in: header
          required: true
          schema:
            type: string
          example: t=1779997509,v1=9d315bd1f0c7653a0f49cc7fe7990a8f2d6d7d9e5e80e3fffe42f7ea0f9b0c4d
        - name: X-MakePay-Delivery-Id
          in: header
          required: false
          schema:
            type: string
            format: uuid
        - name: X-MakePay-Event
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MakePayWebhookEvent"
      responses:
        "200":
          description: Event accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
paths:
  /api/partner/v1/makepay/payment-links:
    get:
      tags: [Payment Links]
      operationId: listPaymentLinks
      summary: List payment links.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Status"
      responses:
        "200":
          description: Payment links for the authenticated merchant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinksResponse"
    post:
      tags: [Payment Links]
      operationId: createPaymentLink
      summary: Create a hosted MakePay payment link.
      description: |
        Creates a payment request and returns a hosted checkout URL. The same
        endpoint can also create anonymous links when a settlement route is
        supplied instead of server-side merchant credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/CreatePaymentLinkRequest"
                - $ref: "#/components/schemas/AnonymousPaymentLinkPayload"
            examples:
              checkout:
                value:
                  status: active
                  sendPaymentRequestEmail: false
                  payload:
                    title: Order #1042
                    description: Hosted checkout for order #1042
                    amount: "129.99"
                    currency: USDT
                    orderId: order_1042
                    customerEmail: buyer@example.com
                    returnUrl: https://merchant.example/orders/1042
                    successUrl: https://merchant.example/orders/1042/success
                    failureUrl: https://merchant.example/orders/1042/pay
      responses:
        "200":
          description: Created payment link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/OnboardingRequired"
  /api/partner/v1/makepay/payment-links/{uid}:
    parameters:
      - $ref: "#/components/parameters/PaymentLinkUid"
    get:
      tags: [Payment Links]
      operationId: getPaymentLink
      summary: Get one payment link.
      responses:
        "200":
          description: Payment link detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkResponse"
    patch:
      tags: [Payment Links]
      operationId: updatePaymentLink
      summary: Update a payment link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentLinkUpdate"
      responses:
        "200":
          description: Updated payment link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkResponse"
  /api/partner/v1/makepay/payment-links/{uid}/send-request-email:
    parameters:
      - $ref: "#/components/parameters/PaymentLinkUid"
    post:
      tags: [Payment Links]
      operationId: sendPaymentRequestEmail
      summary: Send or resend a payment request email.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Email delivery attempt result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkResponse"
